<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChuckJokesVue</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>
<body class="bg-light">

    <div id="app" class="container py-5">

        <h1 class="text-center mb-5">
            Chuck Norris Cards
        </h1>

        <div class="row g-4">

            <!-- CARD -->
            <div class="col-12 col-md-4"
                 v-for="item in jokes">

                <joke-card :icon_url="item.icon_url"
                           :value="item.value">
                </joke-card>

            </div>

        </div>

    </div>

    <script>

const app = Vue.createApp({

    data() {

        return {

            jokes: [

                {
                    icon_url: "img/furby.jpg",
                    value: "Chuck Norris counted to infinity twice."
                },

                {
            icon_url: "img/furby.jpg",
                    value: "Chuck Norris can divide by zero."
                },

                {
                    icon_url: "img/furby.jpg",
                    value: "When Chuck Norris does push-ups, he pushes Earth down."
                },

                {
                    icon_url: "img/furby.jpg",
                    value: "Chuck Norris can hear sign language."
                },

                {
                    icon_url: "img/furby.jpg",
                    value: "Death once had a near-Chuck Norris experience."
                }

            ]

        }

    }

})

/* COMPONENTE */
app.component('joke-card', {

    props: [
        'icon_url',
        'value'
    ],

    template: `

        <div class="card h-100 shadow">

            <img
    :src="icon_url"
    class="card-img-top"
    style="height:250px; object-fit:cover;"
    alt="Imagen">

            <div class="card-body">

                <p class="card-text">
                    {{ value }}
                </p>

            </div>

        </div>

    `

})

app.mount('#app')

    </script>

</body>
</html>
