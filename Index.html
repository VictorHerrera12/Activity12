<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chuck Jokes Vue</title>

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .category {
            background: #42b883;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="app">

        <h1>Chuck Norris Jokes</h1>

        <!-- Lista con v-for -->
        <div class="card" v-for="joke in jokes">

            <div class="category">
                {{ joke.category }}
            </div>

            <p>{{ joke.text }}</p>

        </div>

    </div>

    <script>Vue.createApp({

    data() {

        return {

            jokes: [

                {
                    category: "Funny",
                    text: "Chuck Norris counted to infinity twice."
                },

                {
                    category: "Action",
                    text: "Chuck Norris can divide by zero."
                },

                {
                    category: "Legend",
                    text: "When Chuck Norris does push-ups, he pushes Earth down."
                }

            ]

        }

    }

}).mount('#app')</script>

</body>
</html>
